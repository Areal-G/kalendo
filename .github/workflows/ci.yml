name: CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  # Placeholder so `next build` can prerender; the deployed demo sets its own.
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-in-production

jobs:
  quality:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the in-memory demo data: seed, resets, deterministic ids, RLS.
      - run: npm test
      - run: npm run build
